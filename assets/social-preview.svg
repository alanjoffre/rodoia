<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="RodoIA — Engenharia de IA de ponta a ponta, avaliada sobre gold de terceiros">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d23"/>
      <stop offset="0.55" stop-color="#15171c"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b942"/>
      <stop offset="0.5" stop-color="#e0a326"/>
      <stop offset="1" stop-color="#d97a5c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.14" cy="0.08" r="0.62">
      <stop offset="0" stop-color="#e0a326" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#e0a326" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="0.88" cy="0.94" r="0.62">
      <stop offset="0" stop-color="#d97a5c" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#d97a5c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glowA)"/>
  <rect width="1280" height="640" fill="url(#glowT)"/>
  <rect x="12" y="12" width="1256" height="616" rx="22" fill="none" stroke="#353a45" stroke-width="1.5"/>

  <!-- motivo do grafo do agente (canto superior direito) -->
  <g opacity="0.5" fill="none" stroke="#4a4033" stroke-width="1.5">
    <path d="M1120 90 L1120 150 L1060 200"/>
    <path d="M1120 150 L1120 200"/>
    <path d="M1120 150 L1180 200"/>
  </g>
  <g>
    <circle cx="1120" cy="90"  r="8" fill="#15171c" stroke="#f2b942" stroke-width="2.5"/>
    <circle cx="1120" cy="150" r="7" fill="#15171c" stroke="#e0a326" stroke-width="2.5"/>
    <circle cx="1060" cy="200" r="6" fill="#15171c" stroke="#d97a5c" stroke-width="2.5"/>
    <circle cx="1120" cy="200" r="6" fill="#15171c" stroke="#4fa17b" stroke-width="2.5"/>
    <circle cx="1180" cy="200" r="6" fill="#15171c" stroke="#9195c9" stroke-width="2.5"/>
    <circle cx="140" cy="110" r="6" fill="#15171c" stroke="#e0a326" stroke-width="2.5"/>
    <circle cx="95" cy="150" r="4" fill="#d97a5c" opacity="0.7"/>
  </g>

  <!-- wordmark -->
  <text x="640" y="200" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="98" font-weight="800" letter-spacing="-1.5" fill="url(#ink)">RodoIA</text>

  <!-- taglines -->
  <text x="640" y="253" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#e9e8e2">Engenharia de IA de ponta a ponta</text>
  <text x="640" y="292" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#a2a4ad">do backprop &#224; m&#227;o ao serving avaliado &#183; gold de terceiros, n&#227;o meu</text>

  <!-- pills das 7 fases -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    <g><rect x="287" y="340" width="120" height="36" rx="18" fill="#1c1f26" stroke="#353a45"/><text x="347" y="364" fill="#cfd0cb">Fundamentos</text></g>
    <g><rect x="419" y="340" width="66"  height="36" rx="18" fill="#1c1f26" stroke="#353a45"/><text x="452" y="364" fill="#cfd0cb">RAG</text></g>
    <g><rect x="497" y="340" width="118" height="36" rx="18" fill="#1c1f26" stroke="#353a45"/><text x="556" y="364" fill="#cfd0cb">Fine-tuning</text></g>
    <g><rect x="627" y="340" width="80"  height="36" rx="18" fill="#1c1f26" stroke="#353a45"/><text x="667" y="364" fill="#cfd0cb">Dados</text></g>
    <g><rect x="719" y="340" width="86"  height="36" rx="18" fill="#1c1f26" stroke="#353a45"/><text x="762" y="364" fill="#cfd0cb">Agente</text></g>
    <g><rect x="817" y="340" width="80"  height="36" rx="18" fill="#1c1f26" stroke="#353a45"/><text x="857" y="364" fill="#cfd0cb">MLOps</text></g>
    <g><rect x="909" y="340" width="84"  height="36" rx="18" fill="#241f16" stroke="#e0a32677"/><text x="951" y="364" fill="#f2b942">Escala</text></g>
  </g>

  <!-- chips de metrica -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <g><rect x="334" y="415" width="180" height="40" rx="10" fill="#241f16" stroke="#e0a32666"/><text x="424" y="441" fill="#f2b942">F1 0,13&#8594;0,77</text></g>
    <g><rect x="530" y="415" width="260" height="40" rx="10" fill="#241f16" stroke="#e0a32666"/><text x="660" y="441" fill="#f2b942">recall@5 0,588&#8594;0,652</text></g>
    <g><rect x="806" y="415" width="140" height="40" rx="10" fill="#1a2620" stroke="#4fa17b66"/><text x="876" y="441" fill="#7cc4a0">gate 30/30</text></g>
  </g>

  <!-- linha de rigor -->
  <text x="640" y="486" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#8b8d86">7 fases &#183; 297 testes &#183; IC em toda m&#233;trica &#183; 5 de 7 hip&#243;teses refutadas e publicadas</text>

  <!-- divisor -->
  <line x1="470" y1="510" x2="810" y2="510" stroke="url(#ink)" stroke-width="2" opacity="0.5" stroke-linecap="round"/>

  <!-- rodape -->
  <text x="640" y="550" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#e9e8e2">github.com/alanjoffre/rodoia</text>
  <text x="640" y="580" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#8b8d86">&#9654; demo ao vivo &#183; huggingface.co/spaces/alanjoffre/rodoia-rag</text>

  <!-- motivo de rodovia -->
  <line x1="140" y1="606" x2="1140" y2="606" stroke="#e0a326" stroke-width="2" opacity="0.22" stroke-dasharray="26 18" stroke-linecap="round"/>
</svg>
