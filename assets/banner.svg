<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="RodoIA — Engenharia de IA de ponta a ponta sobre dados públicos da ANTT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d23"/>
      <stop offset="0.55" stop-color="#15171c"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b942"/>
      <stop offset="0.5" stop-color="#e0a326"/>
      <stop offset="1" stop-color="#d97a5c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#e0a326" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e0a326" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="0.92" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#d97a5c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d97a5c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glowA)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glowT)"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#353a45" stroke-width="1"/>

  <!-- direita: grafo do agente (RAG · FT · Dados orquestrados) -->
  <g stroke="#4a4033" stroke-width="1.6" opacity="0.9">
    <line x1="1010" y1="90" x2="1010" y2="170"/>
    <line x1="1010" y1="170" x2="930" y2="240"/>
    <line x1="1010" y1="170" x2="1010" y2="240"/>
    <line x1="1010" y1="170" x2="1090" y2="240"/>
  </g>
  <g>
    <circle cx="1010" cy="90" r="14" fill="#15171c" stroke="#f2b942" stroke-width="2.5"/>
    <circle cx="1010" cy="170" r="12" fill="#15171c" stroke="#e0a326" stroke-width="2.5"/>
    <circle cx="930" cy="240" r="10" fill="#15171c" stroke="#d97a5c" stroke-width="2.5"/>
    <circle cx="1010" cy="240" r="10" fill="#15171c" stroke="#4fa17b" stroke-width="2.5"/>
    <circle cx="1090" cy="240" r="10" fill="#15171c" stroke="#9195c9" stroke-width="2.5"/>
  </g>

  <!-- motivo de rodovia -->
  <line x1="60" y1="310" x2="1140" y2="310" stroke="#e0a326" stroke-width="2" opacity="0.24"
        stroke-dasharray="26 18" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="58" y="112" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#ink)" letter-spacing="-1">RodoIA</text>

  <!-- taglines -->
  <text x="62" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#e9e8e2">Engenharia de IA de ponta a ponta &#183; dados p&#250;blicos da ANTT</text>
  <text x="62" y="178" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#a2a4ad">do backprop escrito &#224; m&#227;o ao serving avaliado &#183; gold de terceiros, n&#227;o meu</text>

  <!-- pills das 7 fases -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">
    <g>
      <rect x="60"  y="200" width="118" height="34" rx="17" fill="#1c1f26" stroke="#353a45"/>
      <text x="119" y="222" fill="#cfd0cb">Fundamentos</text>
    </g>
    <g>
      <rect x="186" y="200" width="66"  height="34" rx="17" fill="#1c1f26" stroke="#353a45"/>
      <text x="219" y="222" fill="#cfd0cb">RAG</text>
    </g>
    <g>
      <rect x="260" y="200" width="118" height="34" rx="17" fill="#1c1f26" stroke="#353a45"/>
      <text x="319" y="222" fill="#cfd0cb">Fine-tuning</text>
    </g>
    <g>
      <rect x="386" y="200" width="80"  height="34" rx="17" fill="#1c1f26" stroke="#353a45"/>
      <text x="426" y="222" fill="#cfd0cb">Dados</text>
    </g>
    <g>
      <rect x="474" y="200" width="86"  height="34" rx="17" fill="#1c1f26" stroke="#353a45"/>
      <text x="517" y="222" fill="#cfd0cb">Agente</text>
    </g>
    <g>
      <rect x="568" y="200" width="80"  height="34" rx="17" fill="#1c1f26" stroke="#353a45"/>
      <text x="608" y="222" fill="#cfd0cb">MLOps</text>
    </g>
    <g>
      <rect x="656" y="200" width="84"  height="34" rx="17" fill="#241f16" stroke="#e0a32677"/>
      <text x="698" y="222" fill="#f2b942">Escala</text>
    </g>
  </g>

  <!-- chips de metrica -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <g>
      <rect x="60"  y="250" width="152" height="32" rx="8" fill="#241f16" stroke="#e0a32666"/>
      <text x="136" y="271" fill="#f2b942">F1 0,13 &#8594; 0,77</text>
    </g>
    <g>
      <rect x="220" y="250" width="222" height="32" rx="8" fill="#241f16" stroke="#e0a32666"/>
      <text x="331" y="271" fill="#f2b942">recall@5 0,588 &#8594; 0,652</text>
    </g>
    <g>
      <rect x="450" y="250" width="112" height="32" rx="8" fill="#1a2620" stroke="#4fa17b66"/>
      <text x="506" y="271" fill="#7cc4a0">gate 30/30</text>
    </g>
    <g>
      <rect x="570" y="250" width="170" height="32" rx="8" fill="#1c1f26" stroke="#353a45"/>
      <text x="655" y="271" fill="#a2a4ad">5 de 7 refutadas</text>
    </g>
  </g>
</svg>
